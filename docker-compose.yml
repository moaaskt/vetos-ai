services:
  postgres:
    image: postgres:15
    container_name: vetos_postgres
    restart: always
    environment:
      POSTGRES_USER: vetos
      POSTGRES_PASSWORD: vetospassword
      POSTGRES_DB: vetos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vetos_internal

  redis:
    image: redis:7
    container_name: vetos_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - vetos_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetos_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - vetos_internal
      - nginx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetos_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - vetos_internal
      - nginx-net

volumes:
  postgres_data:
  redis_data:

networks:
  vetos_internal:
    driver: bridge
  nginx-net:
    external: true
